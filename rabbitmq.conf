## RabbitMQ config for Celery/Kombu compatibility.
##
## Celery's pidbox (remote control) declares transient, non-exclusive queues.
## Newer RabbitMQ versions deprecate and may block this by default, causing
## worker startup to fail with:
##   (541) INTERNAL_ERROR - Feature `transient_nonexcl_queues` is deprecated.
##
## Permit it for now so existing workers can start.
deprecated_features.permit.transient_nonexcl_queues = true

# Headroom for Celery workers (eventlet + reconnect storms).
channel_max = 2048
connection_max = 2048

## MQTT subscription-queue cleanup.
##
## Each simulation agent connects over MQTT and the broker creates a durable
## `mqtt-subscription-<run>_<agent>qos0` queue per agent. When a run ends the celery
## workers are killed (SIGTERM) without a clean MQTT DISCONNECT, so the broker keeps the
## session — and its queue — for `max_session_expiry_interval_seconds`. The default is
## 86400 (1 day), so every run (~5k agents) leaves ~5k orphaned queues lingering for a
## full day. They accumulate across runs (observed: ~7k), bogging down the broker and
## delaying MQTT step delivery, which makes agents miss the scheduler's step deadline.
##
## Bound the post-disconnect session lifetime to 5 minutes. Live agents stay connected
## for the whole run (responding every <=30s), so this never touches an active run; it
## only reaps a run's subscription queues a few minutes after that run exits.
mqtt.max_session_expiry_interval_seconds = 300

